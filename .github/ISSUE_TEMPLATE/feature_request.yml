name: Feature request
description: Propose a focused Workbench improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe behavior and observable completion criteria, not only implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: trust
    attributes:
      label: Trust, privacy, or compatibility impact
      description: Note new network access, persisted data, permissions, dependencies, or migration requirements.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: The proposal uses clear functional names for user-facing capabilities.
          required: true
