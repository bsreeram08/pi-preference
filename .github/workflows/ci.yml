name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out recursively
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned development dependencies
        run: bun install --frozen-lockfile

      - name: Audit development dependencies
        run: bun audit --audit-level=high

      - name: Run tests and strict typecheck
        run: bun run check

      - name: Check installer syntax
        run: |
          bash -n install.sh
          python3 -m py_compile scripts/install-config.py

      - name: Check shell safety
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Run isolated strict installer integration
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-workbench-agent
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ./install.sh --strict

      - name: Ensure verification did not modify source
        run: git diff --exit-code
