version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeBox and Node types stay aligned with the pinned Pi/Node runtime.
    # TypeScript majors are reviewed as compatibility changes.
    ignore:
      - dependency-name: typebox
        versions: [">1.3.7"]
      - dependency-name: "@types/node"
        versions: [">24.12.4"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(submodule)"
